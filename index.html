<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Grind - Digital Menu</title>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #8B6F47;
            --dark: #2C2416;
            --light: #FAF7F2;
            --white: #FFFFFF;
            --gray: #666;
            --border: #E5E5E5;
            --success: #4CAF50;
            --danger: #FF4444;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.5;
        }

        /* Layout */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--white);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        /* Hero */
        .hero {
            height: 240px;
            background-color: var(--dark);
            position: relative;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        .hero-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;
        }

        .hero h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .hero p {
            opacity: 0.9;
            font-size: 14px;
        }

        /* Navigation */
        .nav-scroller {
            overflow-x: auto;
            white-space: nowrap;
            padding: 16px;
            background: var(--white);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            -webkit-overflow-scrolling: touch;
        }

        .nav-scroller::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            display: inline-block;
            padding: 8px 16px;
            margin-right: 8px;
            border-radius: 20px;
            background: var(--light);
            border: 1px solid var(--border);
            color: var(--gray);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .cat-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Menu Grid */
        .menu-grid {
            padding: 16px;
            padding-bottom: 80px;
        }

        .menu-item {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: var(--white);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .menu-item:active {
            transform: scale(0.98);
        }

        .item-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--light);
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .item-title {
            font-weight: 600;
            font-size: 16px;
            color: var(--dark);
        }

        .item-price {
            font-weight: 700;
            color: var(--primary);
            font-size: 15px;
        }

        .item-desc {
            font-size: 12px;
            color: var(--gray);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px;
            background: var(--dark);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            user-select: none;
        }

        /* Admin Interface */
        .admin-panel {
            display: none;
            padding: 20px;
            padding-bottom: 80px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .admin-title {
            font-size: 20px;
            font-weight: 700;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            width: 100%;
            font-size: 15px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--gray);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            margin-top: 10px;
        }

        .admin-item {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .admin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .admin-controls {
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .control-btn {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--light);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--success);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            align-items: flex-end;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--white);
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        /* Admin Trigger Helpers */
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #hidden-file-input {
            display: none;
        }
    </style>
</head>

<body>

    <!-- CUSTOMER VIEW -->
    <div id="customer-view" class="app-container">
        <div class="hero">
            <!-- Default placeholder, will be updated from DB or kept as default -->
            <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=1000&auto=format&fit=crop"
                alt="Cafe Cover">
            <div class="hero-content">
                <h1 id="shop-name">The Daily Grind</h1>
                <p id="shop-tagline">Premium Coffee & Artisan Eats</p>
            </div>
        </div>

        <div class="nav-scroller" id="category-scroller">
            <!-- Categories will be injected here -->
        </div>

        <div class="menu-grid" id="menu-grid">
            <!-- Items injected here -->
        </div>

        <div class="footer" id="app-footer">
            <p>© 2024 The Daily Grind</p>
            <p style="margin-top:8px;">123 Coffee Lane, Brewville</p>
        </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="admin-view" class="app-container admin-panel">
        <div class="admin-header">
            <div class="admin-title">Dashboard</div>
            <button class="control-btn" onclick="logoutAdmin()"
                style="flex:initial; width:auto; padding: 8px 16px;">Logout</button>
        </div>

        <button class="btn btn-primary" onclick="openProductModal()">+ Add New Item</button>

        <div style="margin-top: 24px;" id="admin-list">
            <!-- Admin items injected here -->
        </div>

        <button class="btn btn-outline" onclick="openSettingsModal()" style="margin-top: 24px;">⚙️ Store
            Settings</button>
    </div>

    <!-- MODALS -->
    <!-- Password Modal -->
    <div id="password-modal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 16px;">Admin Access</h2>
            <div class="form-group">
                <input type="password" id="admin-password-input" class="form-input" placeholder="Enter PIN"
                    style="text-align: center; letter-spacing: 4px;">
            </div>
            <button class="btn btn-primary" onclick="verifyPassword()">Unlock</button>
            <button class="btn btn-outline" onclick="closeModal('password-modal')"
                style="margin-top: 12px; border:none;">Cancel</button>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 16px;">Add Item</h2>

            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" id="prod-name" class="form-input">
            </div>

            <div class="form-group" style="display:flex; gap:12px;">
                <div style="flex:1;">
                    <label class="form-label">Price</label>
                    <input type="number" id="prod-price" class="form-input">
                </div>
                <div style="flex:1;">
                    <label class="form-label">Category</label>
                    <select id="prod-cat" class="form-input">
                        <!-- Cats injected -->
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea id="prod-desc" class="form-input" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Image URL</label>
                <input type="text" id="prod-img" class="form-input" placeholder="https://...">
                <button class="control-btn" style="margin-top:8px; width:100%"
                    onclick="document.getElementById('hidden-file-input').click()">Or Upload Photo</button>
                <input type="file" id="hidden-file-input" accept="image/*" onchange="handleImageUpload(this)">
                <div id="upload-status"
                    style="font-size:12px; color:var(--primary); margin-top:4px; text-align:center;"></div>
            </div>

            <button class="btn btn-primary" id="save-btn" onclick="saveProduct()">Save Item</button>
            <button class="btn btn-danger" id="delete-btn" onclick="deleteProduct()" style="display:none;">Delete
                Item</button>
            <button class="btn btn-outline" onclick="closeModal('product-modal')"
                style="margin-top: 12px; border:none;">Cancel</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 16px;">Settings</h2>
            <div class="form-group">
                <label class="form-label">Shop Name</label>
                <input type="text" id="set-name" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">WhatsApp Number</label>
                <input type="text" id="set-whatsapp" class="form-input" placeholder="1234567890">
            </div>
            <div class="form-group">
                <label class="form-label">Admin PIN (Default: 1234)</label>
                <input type="text" id="set-pin" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Manage Categories (Comma separated)</label>
                <input type="text" id="set-cats" class="form-input">
            </div>

            <button class="btn btn-primary" onclick="saveSettings()">Save Changes</button>
            <button class="btn btn-outline" onclick="closeModal('settings-modal')"
                style="margin-top: 12px; border:none;">Close</button>
        </div>
    </div>

    <!-- MAIN LOGIC -->
    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://zuztbitalaurryavwlfg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1enRiaXRhbGF1cnJ5YXZ3bGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0Mzc2NjMsImV4cCI6MjA4NDAxMzY2M30.FaOzzz458dTY9xXtkXzhtIXNaKmOVdOE1kT2dGhWQlU';
        const MASTER_PASSWORD = 'hudson432@#';

        // Initialize Clients
        let supabase = null;
        if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // --- STATE ---
        let state = {
            products: [],
            shop: {
                name: "The Daily Grind",
                tagline: "Premium Coffee & Eats",
                whatsapp: "",
                password: "1234",
                categories: ["Coffee", "Breakfast", "Desserts"]
            },
            view: "customer", // or "admin"
            activeCat: "All Items",
            editingId: null,
            adminStep: 0, // for the 2-step unlock
            unlockTimer: null
        };

        // --- INITIALIZATION ---
        async function init() {
            console.log("🚀 Starting App...");

            // Try Loading from Supabase first
            if (supabase) {
                try {
                    // Load Shop Info
                    const { data: shopData, error: shopError } = await supabase.from('shop_info').select('*').single();
                    if (!shopError && shopData) {
                        state.shop = {
                            ...state.shop,
                            name: shopData.name,
                            tagline: shopData.tagline,
                            whatsapp: shopData.whatsapp,
                            password: shopData.admin_password || "1234"
                        };
                        // Parse categories if they are stored as string or array? Assuming defaults for now or if stored in shop_info
                    }

                    // Load Products
                    const { data: prodData, error: prodError } = await supabase.from('products').select('*');
                    if (!prodError && prodData) {
                        state.products = prodData.map(p => ({
                            id: p.id,
                            name: p.name,
                            price: p.price,
                            category: p.category,
                            description: p.description,
                            image: p.image_url,
                            visible: p.visible
                        }));
                    }
                } catch (err) {
                    console.error("Supabase Load Error:", err);
                }
            }

            // Render UI
            renderCategories();
            renderMenu();
            renderFooter();
            setupAdminTriggers();
        }

        // --- RENDERING ---
        function renderCategories() {
            const container = document.getElementById('category-scroller');
            let html = `<div class="cat-btn ${state.activeCat === 'All Items' ? 'active' : ''}" onclick="setCategory('All Items')">All Items</div>`;
            state.shop.categories.forEach(cat => {
                html += `<div class="cat-btn ${state.activeCat === cat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</div>`;
            });
            container.innerHTML = html;

            // Also populate select in modal
            const select = document.getElementById('prod-cat');
            select.innerHTML = state.shop.categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function renderMenu() {
            const container = document.getElementById('menu-grid');
            const adminList = document.getElementById('admin-list');

            let filtered = state.products;
            if (state.activeCat !== 'All Items') {
                filtered = filtered.filter(p => p.category === state.activeCat);
            }

            // Customer View HTML
            container.innerHTML = filtered.filter(p => p.visible).map(p => `
                <div class="menu-item" onclick="orderItem('${p.name}')">
                    <img src="${p.image || 'https://via.placeholder.com/150'}" class="item-img" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="item-details">
                        <div>
                            <div class="item-header">
                                <div class="item-title">${p.name}</div>
                                <div class="item-price">₹${p.price}</div>
                            </div>
                            <div class="item-desc">${p.description || ''}</div>
                        </div>
                        <div style="margin-top:8px; font-size:12px; color:var(--primary); font-weight:600;">Tap to Order →</div>
                    </div>
                </div>
            `).join('') || '<div style="text-align:center; padding:40px; color:var(--gray);">No items found.</div>';

            // Admin List HTML
            adminList.innerHTML = state.products.map(p => `
                <div class="admin-item">
                    <div class="admin-row">
                        <div style="font-weight:600;">${p.name}</div>
                        <div>₹${p.price}</div>
                    </div>
                    <div class="admin-controls">
                        <label class="switch">
                             <input type="checkbox" ${p.visible ? 'checked' : ''} onchange="toggleInfo('${p.id}')">
                             <span class="slider"></span>
                        </label>
                        <button class="control-btn" onclick="editProduct('${p.id}')">Edit</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('shop-name').textContent = state.shop.name;
            document.getElementById('shop-tagline').textContent = state.shop.tagline;
        }

        function renderFooter() {
            document.getElementById('app-footer').innerHTML = `
                <p>© 2024 ${state.shop.name}</p>
                <div style="margin-top:20px; font-size:10px; opacity:0.3;">Admin Area Protected</div>
            `;
        }

        // --- ACTIONS ---
        function setCategory(cat) {
            state.activeCat = cat;
            renderCategories();
            renderMenu();
        }

        function orderItem(itemName) {
            if (!state.shop.whatsapp) return alert("Please ask staff to set a WhatsApp number in settings!");
            const phone = state.shop.whatsapp.replace(/[^0-9]/g, '');
            const url = `https://wa.me/${phone}?text=Hi, I would like to order: ${encodeURIComponent(itemName)}`;
            window.open(url, '_blank');
        }

        // --- ADMIN LOGIC ---
        function setupAdminTriggers() {
            // Trigger 1: Long Press "All Items" tab
            const allItemsBtn = document.querySelector('.cat-btn'); // first one is All Items
            let pressTimer;

            if (allItemsBtn) {
                allItemsBtn.addEventListener('mousedown', () => {
                    pressTimer = setTimeout(() => {
                        console.log("Step 1 Unlocked");
                        state.adminStep = 1;
                        // visual feedback
                        allItemsBtn.style.transform = "scale(1.1)";
                        setTimeout(() => allItemsBtn.style.transform = "scale(1)", 200);

                        // Reset if step 2 isn't done in 10s
                        clearTimeout(state.unlockTimer);
                        state.unlockTimer = setTimeout(() => { state.adminStep = 0; console.log("Reset"); }, 10000);
                    }, 3000);
                });
                allItemsBtn.addEventListener('mouseup', () => clearTimeout(pressTimer));
                allItemsBtn.addEventListener('touchstart', () => {
                    pressTimer = setTimeout(() => {
                        state.adminStep = 1;
                        alert("Step 1/2 complete. Long press footer now.");
                        clearTimeout(state.unlockTimer);
                        state.unlockTimer = setTimeout(() => { state.adminStep = 0; }, 10000);
                    }, 3000);
                });
                allItemsBtn.addEventListener('touchend', () => clearTimeout(pressTimer));
            }

            // Trigger 2: Long Press Footer
            const footer = document.getElementById('app-footer');
            let footerTimer;

            footer.addEventListener('mousedown', () => {
                footerTimer = setTimeout(() => {
                    if (state.adminStep === 1) {
                        document.getElementById('password-modal').classList.add('active');
                        state.adminStep = 0;
                    }
                }, 3000);
            });
            footer.addEventListener('mouseup', () => clearTimeout(footerTimer));
            footer.addEventListener('touchstart', () => {
                footerTimer = setTimeout(() => {
                    if (state.adminStep === 1) {
                        document.getElementById('password-modal').classList.add('active');
                        state.adminStep = 0;
                    }
                }, 3000);
            });
            footer.addEventListener('touchend', () => clearTimeout(footerTimer));
        }

        function verifyPassword() {
            const input = document.getElementById('admin-password-input').value;
            if (input === state.shop.password || input === MASTER_PASSWORD) {
                closeModal('password-modal');
                document.getElementById('customer-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
                document.getElementById('admin-password-input').value = "";
            } else {
                alert("Incorrect PIN");
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-view').style.display = 'none';
            document.getElementById('customer-view').style.display = 'block';
        }

        // --- CRUD OPERATIONS ---

        function openProductModal(id = null) {
            state.editingId = id;
            const modal = document.getElementById('product-modal');
            const title = document.getElementById('modal-title');
            const delBtn = document.getElementById('delete-btn');

            if (id) {
                // EDIT MODE
                // LOOSE EQUALITY CHECK intentionally used to match string/number IDs
                const p = state.products.find(x => x.id == id);
                if (!p) return alert("Error finding product");

                title.innerText = "Edit Item";
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-price').value = p.price;
                document.getElementById('prod-cat').value = p.category;
                document.getElementById('prod-desc').value = p.description || "";
                document.getElementById('prod-img').value = p.image || "";
                delBtn.style.display = "block";
            } else {
                // NEW MODE
                title.innerText = "Add New Item";
                document.getElementById('prod-name').value = "";
                document.getElementById('prod-price').value = "";
                document.getElementById('prod-desc').value = "";
                document.getElementById('prod-img').value = "";
                delBtn.style.display = "none";
            }
            modal.classList.add('active');
        }

        async function saveProduct() {
            const btn = document.getElementById('save-btn');
            const originalText = btn.innerText;
            btn.innerText = "Saving...";

            const p = {
                name: document.getElementById('prod-name').value,
                price: parseFloat(document.getElementById('prod-price').value),
                category: document.getElementById('prod-cat').value,
                description: document.getElementById('prod-desc').value,
                image_url: document.getElementById('prod-img').value,
                visible: true
            };

            if (!p.name || isNaN(p.price)) {
                alert("Please enter valid Name and Price");
                btn.innerText = originalText;
                return;
            }

            // SUPABASE SAVE
            if (supabase) {
                try {
                    if (state.editingId) {
                        await supabase.from('products').update(p).eq('id', state.editingId);
                        // update local state
                        const idx = state.products.findIndex(x => x.id == state.editingId);
                        if (idx !== -1) {
                            state.products[idx] = { ...state.products[idx], ...p, image: p.image_url };
                        }
                    } else {
                        const { data, error } = await supabase.from('products').insert(p).select().single();
                        if (error) throw error;
                        state.products.push({ ...data, image: data.image_url });
                    }
                } catch (e) {
                    alert("Save Failed: " + e.message);
                }
            } else {
                // FALLBACK LOCAL SAVE
                if (state.editingId) {
                    const idx = state.products.findIndex(x => x.id == state.editingId);
                    if (idx !== -1) state.products[idx] = { ...state.products[idx], ...p, image: p.image_url };
                } else {
                    state.products.push({ id: Date.now(), ...p, image: p.image_url });
                }
            }

            btn.innerText = originalText;
            closeModal('product-modal');
            renderMenu();
        }

        async function deleteProduct() {
            if (!confirm("Are you sure?")) return;

            if (supabase && state.editingId) {
                await supabase.from('products').delete().eq('id', state.editingId);
            }
            // Local update
            state.products = state.products.filter(p => p.id != state.editingId);
            closeModal('product-modal');
            renderMenu();
        }

        async function toggleInfo(id) {
            const p = state.products.find(x => x.id == id);
            if (p) {
                p.visible = !p.visible;
                if (supabase) await supabase.from('products').update({ visible: p.visible }).eq('id', id);
                renderMenu(); // re-render to update UI
            }
        }

        async function handleImageUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const status = document.getElementById('upload-status');
            status.innerText = "Uploading...";

            if (supabase) {
                try {
                    const fileName = `img_${Date.now()}_${file.name.replace(/[^a-z0-9.]/gi, '_')}`;
                    const { data, error } = await supabase.storage.from('product-images').upload(fileName, file);

                    if (error) throw error;

                    const { data: { publicUrl } } = supabase.storage.from('product-images').getPublicUrl(fileName);
                    document.getElementById('prod-img').value = publicUrl;
                    status.innerText = "Upload Complete!";
                } catch (e) {
                    console.error(e);
                    status.innerText = "Upload Failed: " + e.message;
                }
            } else {
                status.innerText = "Setup Supabase storage first.";
            }
        }

        // --- SETTINGS ---
        function openSettingsModal() {
            document.getElementById('set-name').value = state.shop.name;
            document.getElementById('set-whatsapp').value = state.shop.whatsapp;
            document.getElementById('set-pin').value = state.shop.password;
            document.getElementById('set-cats').value = state.shop.categories.join(", ");
            document.getElementById('settings-modal').classList.add('active');
        }

        async function saveSettings() {
            const newName = document.getElementById('set-name').value;
            const newWa = document.getElementById('set-whatsapp').value;
            const newPin = document.getElementById('set-pin').value;
            const catsStr = document.getElementById('set-cats').value;

            state.shop.name = newName;
            state.shop.whatsapp = newWa;
            state.shop.password = newPin;
            state.shop.categories = catsStr.split(',').map(s => s.trim()).filter(Boolean);

            if (supabase) {
                await supabase.from('shop_info').update({
                    name: newName,
                    whatsapp: newWa,
                    admin_password: newPin
                }).eq('id', 1); // Assuming single row ID 1
            }

            closeModal('settings-modal');
            renderMenu();
            renderCategories();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // --- EXPOSE FUNCTIONS TO WINDOW (Fix for Scope Issue) ---
        window.setCategory = setCategory;
        window.orderItem = orderItem;
        window.logoutAdmin = logoutAdmin;
        window.openProductModal = openProductModal;
        window.openSettingsModal = openSettingsModal;
        window.verifyPassword = verifyPassword;
        window.saveProduct = saveProduct;
        window.deleteProduct = deleteProduct;
        window.saveSettings = saveSettings;
        window.closeModal = closeModal;
        window.toggleInfo = toggleInfo;
        window.editProduct = openProductModal; // Alias for edit
        window.handleImageUpload = handleImageUpload;

        // Run
        init();

    </script>
</body>

</html>
